; =============================================================================
; BigCat 參數檔（建置時由 Par/ 複製到 BigCat.exe 同目錄；UI 變更會即時寫回本檔）
;
; 注意：註解請獨立成一行並以「;」開頭。數值後方不要接註解 —
;       整數/浮點數可容忍，但字串值（Password、InputName、AutoSelectedAdapter、
;       OperationMode）會把註解文字一起讀進去而失效。
; =============================================================================

[Logging]
; 是否寫入 status.log（1=寫檔，0=只顯示於 UI 狀態列不寫檔）
EnableStatusLog=1

[Network]
; 上次使用的 EtherCAT 網卡（Npcap 裝置名稱，格式 rpcap://\Device\NPF_{GUID}）
; 由 UI 網卡選單自動寫入；留空 = 尚未選擇
AutoSelectedAdapter=rpcap://\Device\NPF_{705C1471-3FDE-4B1F-92F6-EC625652EACB}

[Startup]
; 啟動時是否顯示主視窗（1=顯示，0=直接最小化到系統匣）
ShowMainWindow=0
; 啟動後是否自動執行「連線 + 自動程序」序列（1=自動，0=全部手動）
AutoTrigger=1

[Server]
; 內建 HTTP/SSE 伺服器（Web UI 與 REST API，起始 port 8080，被占用時自動往上跳號）（1=啟動，0=不啟動）
EnableLocalHttpServer=0
; HTTP 伺服器密碼（Web UI 與 API 認證用）
Password=1234

[Motion]
; 週期運動模式：CSP = 週期同步位置（CiA402 mode 8）、CSV = 週期同步速度（mode 9）
OperationMode=CSP
; 是否偵測外部急停輸入（PDO 0x60FD bit0）（1=啟用，0=停用）
ExternalEstopEnabled=1
; AutoDownToOrigin 反向點動的「卡住」判定（速度）：實際機械速度 > 此值即視為受阻並停止點動
; 單位 deg/s（負值代表與反向點動同向）
ReverseJogSpeedThreshold=-2.5
; AutoDownToOrigin 反向點動的「卡住」判定（扭矩；X1S/X5_7SEtherCAT 等驅動器改用本項）
; 實際扭矩 > 此值即視為受阻；單位 0.1% 額定扭矩
ReverseJogTorqueThreshold=400

[MMF]
; MMF1 輸入對應名稱（FlyPT Mover 等外部程式寫入的 MMF 名稱）
; 留空或維持內建值時使用模式內定名稱：Pose6D=OUTPUT_MMF_6DOF、ServoAngle=OUTPUT_MMF_DEG
InputName=OUTPUT_MMF_6DOF

[PDOFilter]
; 動態違規門檻 = motion.xml 各軸設定值 × 以下倍率
; 速度門檻倍率（0.60 = 該軸最大速度的 60% 即視為超速）
DynamicVelocityThresholdScale=0.60
; 加速度門檻倍率（1.20 = 該軸最大加/減速的 120%）
DynamicAccelerationThresholdScale=1.20
; 速度超限需持續幾秒才判定違規（秒）
DynamicVelocityViolationDelaySec=0.50
; 加速度超限需持續幾秒才判定違規（秒）
DynamicAccelerationViolationDelaySec=0.20

[Safety]
; 程式執行期間封鎖 Windows 關機/重新啟動/登出（1=封鎖（預設），0=不封鎖）
; 封鎖時系統關機畫面會顯示「BigCat 正在執行運動控制…」；使用者仍可選「仍要關機」強制關機
BlockSystemShutdown=1
; 防止系統因閒置進入睡眠（螢幕仍可關閉）（1=防止（預設），0=不防止）
; 僅在本程式執行期間有效，程式關閉即恢復系統設定
KeepSystemAwake=1
; Windows Update 不因更新自動重新啟動（1=寫入 HKLM 原則，需管理員權限；0=不碰登錄檔（預設））
; 還原方式：reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v NoAutoRebootWithLoggedOnUsers /f
BlockWindowsUpdateAutoReboot=0

[Compat]
; 強制使用 Windows 10 的執行方式（週期等待策略：high-resolution waitable timer + 200µs TSC spin margin）
; 1 = 即使在 Windows 11 也強制採用 Win10 策略（等效於所有 !g_isWin11 分支成立；RT 核心 CPU 使用率較低約 15%）
; 0 = 依作業系統自動判斷（預設；Win11 使用 SwitchToThread 迴圈，CPU 約 95% 但可靠）
; 用途：釐清 Win10/Win11 行為差異，或作為 Win11 waitable-timer 修復後的回退開關。
; 註：於 CyclicTask 啟動時讀取一次，修改後需重新連線（或重新啟動程式）才生效。
ForceWin10Mode=0
