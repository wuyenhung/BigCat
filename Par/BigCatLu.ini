[Logging]
EnableStatusLog=0
[Network]
AutoSelectedAdapter=rpcap://\Device\NPF_{85F61866-C97B-4C68-9931-A020DF94CBC6}
[Startup]
ShowMainWindow=1
AutoTrigger=0
[Server]
EnableLocalHttpServer=1
Password=1234

[Motion]
OperationMode=CSP
ExternalEstopEnabled=0
ReverseJogSpeedThreshold=-0.5
ReverseJogTorqueThreshold=400

[MMF]
InputName=OUTPUT_MMF_6DOF

[PDOFilter]
DynamicVelocityThresholdScale=0.8
DynamicAccelerationThresholdScale=0.4
DynamicVelocityViolationDelaySec=0.1
DynamicAccelerationViolationDelaySec=0.1

[Safety]
; 程式執行期間封鎖 Windows 關機/重新啟動/登出（WM_QUERYENDSESSION 回 FALSE）
BlockSystemShutdown=1
; 防止系統閒置進入睡眠（螢幕仍可關閉）；僅在本程式執行期間有效
KeepSystemAwake=1
; Windows Update 不因更新自動重新啟動（寫入 HKLM 原則，需管理員權限）
; 還原方式: reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v NoAutoRebootWithLoggedOnUsers /f
BlockWindowsUpdateAutoReboot=0

[Compat]
; 強制使用 Windows 10 的執行方式（週期等待策略：HR waitable timer + 200µs TSC margin）
; 1=即使在 Win11 也強制採用 Win10 策略；0=依作業系統自動判斷（預設）
ForceWin10Mode=0
