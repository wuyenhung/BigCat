<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/i18n.js"></script><!-- i18n 多語系引擎：必須在其他 script 之前載入 -->
  <title>狀態訊息</title>
  <link rel="icon" href="ka52.ico" type="image/x-icon">
  <link rel="shortcut icon" href="ka52.ico" type="image/x-icon">
    <!-- Stylesheet load order (do not change):
      1) shared-variables.css (global CSS variables - MUST be first)
      2) sidebar-menu.css (shared layout/components that depend on variables)
      3) page-specific styles (stay after shared files)
    -->
    <link rel="stylesheet" href="shared-variables.css">
    <link rel="stylesheet" href="sidebar-menu.css">
  <style>
    :root {
      /* Fluid typography: starts at 16px, scales with viewport */
      --font-size: clamp(16px, 4vw, 20px);
    }

    body {
      font-family: "Segoe UI", "Microsoft JhengHei UI", sans-serif;
      margin: 0;
      padding: 12px;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      font-size: var(--font-size);
      /* 暗黑底色佈局：改用全站共用色彩變數（與 auto.html、側選單一致），
         不再用白底 #fff / 深灰字 #333（與其他頁面風格不符，且接上 log 時刺眼）。 */
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    #controls {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    /* page-level button styling excludes sidebar buttons so shared sidebar-menu.css is not overridden */
    button:not(.menu-toggle):not(.sidebar-buttons *) {
      font-size: inherit;
      padding: 0.4em 0.8em;
      cursor: pointer;
      /* 暗黑佈局：瀏覽器預設的淺灰按鈕放在深底上很突兀，改為與側選單同系的深色按鈕 */
      background: linear-gradient(180deg, #3f3f3f, #333);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    button:not(.menu-toggle):not(.sidebar-buttons *):hover:not(:disabled) {
      background: linear-gradient(180deg, #4a4a4a, #3a3a3a);
      border-color: #5a5a5a;
    }

    button:not(.menu-toggle):not(.sidebar-buttons *):disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Use shared sizing for controls so page-level buttons match site-wide tokens */
    #controls button {
      height: var(--btn-height);
      min-width: var(--btn-min-width);
      display: inline-flex;
      align-items: center;
      padding: 8px 12px; /* keep sensible touch target */
    }

    /* Sidebar button sizing is now provided by shared sidebar-menu.css */

    label {
      -webkit-user-select: none; /* Safari 3+ */
      display: flex;
      align-items: center;
      gap: 0.5em;
      cursor: pointer;
      user-select: none;
    }

    input[type="checkbox"] {
      width: 1.2em;
      height: 1.2em;
      margin: 0;
      accent-color: var(--accent); /* 深底色下用主色作為勾選色 */
      cursor: pointer;
    }

    /* JS 只設背景（綠/紅），文字一律保持淺色才有對比 */
    .status-message {
      color: #fff;
    }

    pre {
      /* 暗黑佈局：log 區塊改用面板色＋細框，並保留折返避免橫向捲軸 */
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #e6e6e6;
      padding: 12px;
      flex: 1;
      overflow: auto;
      margin: 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9em;
      /* Ensure text wraps on small screens so no horizontal scroll is needed for text */
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* 暗黑佈局：捲軸與反白也走深色，避免殘留的白框破壞整體色感 */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #1b1b1b;
    }

    ::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #6a6a6a;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }
  </style>
  <!-- Load auth.js early so initAuthCheck is available -->
  <script src="auth.js"></script>
</head>

<body>
  <h1 class="status-header">狀態訊息</h1>
  <div id="controls">
    <button id="btnClearStatus" title="清除訊息">清除訊息</button>
    <label class="controls-label">自動刷新:<input id="auto" type="checkbox" checked title="自動刷新"></label>
  </div>
  <div id="statusMessage" aria-live="polite" class="status-message"></div>
  <pre id="log">載入中...</pre>
  <script>
    const log = document.getElementById('log');
    const chk = document.getElementById('auto');
    // 動態寫入的訊息也要過翻譯目錄（<pre> 與 JS 直接賦值都不經過 MutationObserver；
    // i18n.js 未載入時退回中文原文，不影響功能）。
    const T = (s) => (window.I18N ? window.I18N.t(s) : s);
    async function load() {
      try {
        const r = await fetch('/status');
        if (r.ok) {
          const t = await r.text();
          log.textContent = t;
          // show newest logs at top: scroll to top instead of bottom
          log.scrollTop = 0;
        } else {
          log.textContent = T('無法載入狀態: ' + r.status);
        }
      } catch (e) {
        log.textContent = T('錯誤: ' + e.toString());
      }
    }
    // Refresh button removed; auto-refresh remains enabled via checkbox
    // Clear status button: call server POST /clear_status and refresh viewer
    const btnClear = document.getElementById('btnClearStatus');
    if (btnClear) {
      const msg = document.getElementById('statusMessage');
      const showMsg = (t, ok) => {
        if (!msg) return;
        msg.textContent = T(t);
        msg.style.display = 'block';
        msg.style.background = ok ? 'rgba(0,128,0,0.75)' : 'rgba(180,20,20,0.9)';
        setTimeout(() => { msg.style.display = 'none'; }, 2500);
      };

      btnClear.addEventListener('click', async () => {
        try {
          btnClear.disabled = true;
          const r = await fetch('/clear_status', { method: 'POST', credentials: 'same-origin' });
          if (r.status === 401) {
            // Not authorized — user likely needs to login
            showMsg('需要登入，請回到首頁登入', false);
            return;
          }
          if (!r.ok) {
            showMsg('清除失敗 (' + r.status + ')', false);
            console.error('清除狀態失敗', r.status);
            return;
          }
          // success
          showMsg('已清除狀態', true);
        } catch (e) {
          console.error('清除狀態失敗:', e);
          showMsg('發生網路錯誤', false);
        } finally {
          // always re-enable and refresh view
          btnClear.disabled = false;
          await load();
        }
      });
    }
    // Initialize: Check auth and start loading
    (async function init() {
      await window.Auth.ready();
        setInterval(() => { if (chk.checked) load(); }, 5000);
        load();
        
        window.Auth.installBfcacheReload();
    })();
  </script>
  <!-- 侧滑菜单功能 -->
  <script src="sidebar-menu.js"></script>
</body>

</html>
