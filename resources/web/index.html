<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">

  <script src="js/i18n.js"></script><!-- i18n 多語系引擎：必須在其他 script 之前載入 -->
  <title>BigCat_運動控制系統_V1.0_立洋科技</title>
  <link rel="icon" href="ka52.ico" type="image/x-icon">
  <link rel="shortcut icon" href="ka52.ico" type="image/x-icon">
    <!-- Stylesheet load order (do not change):
      1) shared-variables.css (global CSS variables - MUST be first)
      2) sidebar-menu.css (shared layout/components that depend on variables)
      3) page-specific styles (stay after shared files)
    -->
    <link rel="stylesheet" href="shared-variables.css">

</head>

<body>
  <div class="header">
    <!-- Hamburger/menu markup is provided by the shared sidebar-menu.js to keep pages consistent -->

    <h1>BigCat_運動控制系統_V1.0_立洋科技</h1>

    <!-- Header connection controls: move [連接] / [斷開] here (homepage only) -->
    <div id="headerConnectionControls" class="header-connection-controls" aria-label="連接控制">
      <!-- Buttons will be created by page JS and inserted here -->
    </div>

    <div class="login-section">
      <div id="authButtons"></div>
      <span id="authStatus" class="auth-status"></span>
    </div>
  </div>
  <div class="container">
    <div class="control-panel">
      <div class="control-row">
        <div class="control-group">
          <label class="control-label">網路介面卡 (Adapter)</label>
          <select id="adapterSelect" class="control-input" disabled aria-label="網路介面卡">
            <option>TWINCAT Adapter</option>
            <option>Ethernet 1</option>
          </select>

        </div>
        <div class="control-group">
          <label class="control-label">設定週期 (ms)</label>
          <!-- clickable input-like control that opens a decimal numeric keypad -->
          <div id="configuredPeriod" class="control-input field-input" tabindex="0" role="button"
            aria-label="設定週期（可編輯），點擊以輸入數字">1.00 ms</div>
          <!-- hidden input to hold numeric value (ms) for form/JS interaction -->
          <input id="configuredPeriodInput" type="hidden" value="1.00" />
        </div>
        <div class="control-group">
          <label class="control-label">實際週期 (ms)</label>
          <input id="actualPeriod" class="control-input field-display" disabled value="0.00 ms" title="實際週期" />
        </div>
        <div class="control-group">
          <label class="control-label">最大週期 (ms)</label>
          <div id="maxPeriod" class="control-input field-display">0.00 ms</div>
        </div>
      </div>

    </div>

    <div class="slaves-section">
      <h3>從站列表</h3>
      <div class="slave-header">
        <label class="control-label">選定從站</label>
        <select id="slaveSelect" class="control-input" disabled aria-label="選定從站">
          <option value="">未選擇</option>
        </select>
        <!-- ESI 檔案讀取：隱藏的 file input 與顯示按鈕，放置在從站下拉選單旁 -->
        <button id="btnBrowseEsi">ESI
          檔案讀取</button>
      </div>
      <div id="slavesContainer">(loading...)</div>
      <div class="sdo-buttons-row">
        <button id="btnReadSDO" class="control-input">讀取</button>
        <button id="btnWriteSDO" class="control-input">寫入</button>
        <button id="btnReadAllSDO" class="control-input">全部讀取</button>
        <button id="btnWriteAllSDO" class="control-input">全部寫入</button>
      </div>
      <div id="sdoArea" class="sdo-display">
        <table id="sdoTable">
          <tr>
            <th>Index</th>
            <th>Sub</th>
            <th>Name</th>
            <th>Type</th>
            <th>Access</th>
            <th>Value</th>
            <th>Hex</th>
          </tr>
          <!-- 5 default empty rows -->
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </table>
      </div>
    </div>
  </div>
  <script>
    // Responsive behavior: adjust CSS variables and SDO height based on window size
    (function () {
      const root = document.documentElement;
      const sdoArea = document.getElementById('sdoArea');
      let resizeTimer = null;
      function applyResponsive() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        // scale base font a bit depending on width
        let baseFont = 16;
        if (w < 480) baseFont = 13;
        else if (w < 768) baseFont = 14;
        else if (w < 1024) baseFont = 15;
        root.style.setProperty('--base-font-size', baseFont + 'px');
        document.documentElement.style.fontSize = baseFont + 'px';

        // field width: proportional but clamped
        let fw = Math.max(120, Math.min(320, Math.floor(w * 0.18)));
        root.style.setProperty('--field-width', fw + 'px');

        // field height scales slightly with font
        let fh = Math.max(32, Math.min(56, Math.floor(baseFont * 2.5)));
        root.style.setProperty('--field-height', fh + 'px');

        // sdo area height: keep a fraction of viewport but at least 120px
        let sdoH = Math.max(120, Math.floor(h * 0.28));
        root.style.setProperty('--sdo-max-height', sdoH + 'px');
        if (sdoArea) sdoArea.style.maxHeight = sdoH + 'px';
      }
      window.addEventListener('resize', () => {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { applyResponsive(); resizeTimer = null; }, 120);
      });
      // initial
      applyResponsive();
    })();

    // local log updater: forward to console.debug so calls remain safe but visible during development
    function updateLocalStatus(msg) { try { console.debug('[localStatus]', msg); } catch (e) { /* ignore */ } }
    const authStatus = document.getElementById('authStatus');

    // Single-window navigation: we will navigate inside the same tab

    /**
     * Detects if the current device is a mobile device
     * @returns {boolean} true if mobile device
     */
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);
    }

    /**
     * Opens a window with the given URL and name, or focuses it if already open.
     * Mobile devices: Always opens in new tab due to focus() limitations
     * Desktop: Reuses existing window when possible
     * @param {string} url - The URL to open
     * @param {string} windowName - Unique name for the window (used for reuse)
     */
    function openOrFocusWindow(url, windowName) {
      // Navigate within the same tab/window, do not open new windows or tabs.
      try {
        if (window.location.href !== url) {
          window.location.assign(url);
        }
      } catch (e) {
        console.error('[openOrFocusWindow] Failed to navigate to', url, e);
        try { window.location.href = url; } catch (e2) { updateLocalStatus('無法導向頁面 - ' + e2.toString()); }
      }
      return;
    }

    /* Sidebar controls are handled by the shared sidebar-menu.js
       to avoid duplicated logic on each page. */

    // login state (cookie-based session). We don't store API key in front-end.
    // Do NOT default to a logged-in state from localStorage on page open.
    // We prefer the server / explicit session checks to establish login state.
    if (typeof window._loggedIn === 'undefined') {
      window._loggedIn = false; // will be updated after server-side check (checkForceLogout)
    }

    // Initialize auth UI on page load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { updateAuthUI(); });
    } else {
      // DOM already loaded, call immediately
      updateAuthUI();
    }

    function updateAuthUI() {
      const authButtons = document.getElementById('authButtons');
      const authStatus = document.getElementById('authStatus');
      // clear existing buttons
      while (authButtons && authButtons.firstChild) authButtons.removeChild(authButtons.firstChild);
      // Create header / auth buttons regardless of login state; disable them if not logged in

      // connection control container (may be present on homepage)
      const connControls = document.getElementById('headerConnectionControls');

        // create "示波器" button (open RT_scope.html)
        const btnOsc = document.createElement('button');
        btnOsc.id = 'btnOscilloscope';
        btnOsc.textContent = '示波器';
        btnOsc.addEventListener('click', () => {
          openOrFocusWindow('/RT_scope.html', 'wusoem_oscilloscope');
        });
        btnOsc.disabled = !window._loggedIn;
        authButtons.appendChild(btnOsc);

        // create "姿態顯示" button (open viewer_6dof.html)
        const btnAtt = document.createElement('button');
        btnAtt.id = 'btnAttitude';
        btnAtt.textContent = '姿態顯示';
        // Use the current origin so the viewer opens correctly whether server binds localhost or a LAN IP
        btnAtt.addEventListener('click', () => {
          openOrFocusWindow(window.location.origin + '/viewer_6dof.html', 'wusoem_attitude');
        });
        btnAtt.disabled = !window._loggedIn;
        authButtons.appendChild(btnAtt);

        // create "機構設定" button (to open stewart_platform.html)
        const btnMechanism = document.createElement('button');
        btnMechanism.id = 'btnMechanism';
        btnMechanism.textContent = '機構設定';
        btnMechanism.addEventListener('click', () => {
          openOrFocusWindow('/stewart_platform.html', 'wusoem_mechanism');
        });
        btnMechanism.disabled = !window._loggedIn;
        authButtons.appendChild(btnMechanism);

        // create "狀態訊息" button
        const btnToggleStatusHeader = document.createElement('button');
        btnToggleStatusHeader.id = 'btnToggleStatusHeader';
        btnToggleStatusHeader.textContent = '狀態訊息';
        btnToggleStatusHeader.addEventListener('click', () => {
          openOrFocusWindow('/status.html', 'wusoem_status');
        });
        btnToggleStatusHeader.disabled = !window._loggedIn;
        authButtons.appendChild(btnToggleStatusHeader);

        // '清除狀態' button moved to status.html (top-right) per UI change

        // create "連接" button
        // create or reuse connect button (avoid duplicates on re-runs)
        let btnConnectHeader = document.getElementById('btnConnectHeader');
        if (!btnConnectHeader) {
          btnConnectHeader = document.createElement('button');
          btnConnectHeader.id = 'btnConnectHeader';
        }
        btnConnectHeader.textContent = '連接';
        btnConnectHeader.addEventListener('click', async () => {
          try {
            const r = await guardedPost('btnConnectHeader', '/connect');
            if (!r.ok) {
              if (r.text === 'not_logged_in') {
                try { showPinModal(); } catch (_) {}
              } else {
                // Try to parse server JSON response (e.g. {error,active,max}) and show a user-friendly message
                try {
                  const parsed = JSON.parse(r.text);
                  if (parsed && parsed.error) {
                    let msg = parsed.error;
                    if (parsed.active !== undefined && parsed.max !== undefined) msg += ` (目前連線 ${parsed.active}/${parsed.max})`;
                    updateLocalStatus && updateLocalStatus('連接失敗 - ' + msg);
                  } else {
                    updateLocalStatus && updateLocalStatus('連接失敗 - ' + r.text);
                  }
                } catch (e) {
                  updateLocalStatus && updateLocalStatus('連接失敗 - ' + r.text);
                }
              }
            }
          } catch (e) { console.error('連接失敗:', e); }
        });
        // place connect in the headerConnectionControls (homepage title area)
        btnConnectHeader.disabled = !window._loggedIn;
        if (connControls) {
          if (btnConnectHeader.parentElement !== connControls) connControls.appendChild(btnConnectHeader);
        } else if (authButtons && btnConnectHeader.parentElement !== authButtons) {
          authButtons.appendChild(btnConnectHeader);
        }

        // create "斷開" button
        // create or reuse disconnect button (avoid duplicates on re-runs)
        let btnDisconnectHeader = document.getElementById('btnDisconnectHeader');
        if (!btnDisconnectHeader) {
          btnDisconnectHeader = document.createElement('button');
          btnDisconnectHeader.id = 'btnDisconnectHeader';
        }
        btnDisconnectHeader.textContent = '斷開';
        btnDisconnectHeader.addEventListener('click', async () => {
          try {
            const r = await guardedPost('btnDisconnectHeader', '/disconnect');
            if (!r.ok) {
              if (r.text === 'not_logged_in') {
                try { showPinModal(); } catch (_) {}
              } else {
                updateLocalStatus && updateLocalStatus('斷開失敗 - ' + r.text);
              }
            }
          } catch (e) { console.error('斷開失敗:', e); }
        });
        btnDisconnectHeader.disabled = !window._loggedIn;
        if (connControls) {
          if (btnDisconnectHeader.parentElement !== connControls) connControls.appendChild(btnDisconnectHeader);
        } else if (authButtons && btnDisconnectHeader.parentElement !== authButtons) {
          authButtons.appendChild(btnDisconnectHeader);
        }

        // create "Auto Test" button to open auto_test.html
        const btnAutoTest = document.createElement('button');
        btnAutoTest.id = 'btnAutoTest';
        btnAutoTest.textContent = '自動畫面';
        btnAutoTest.addEventListener('click', () => {
          openOrFocusWindow('/auto.html', 'wusoem_auto');
        });
        btnAutoTest.disabled = !window._loggedIn;
        authButtons.appendChild(btnAutoTest);

        // create "自動程序啟動" / "自動程序停止" buttons in the header area
        // create or reuse start/stop auto buttons (avoid duplicates on re-runs)
        let btnStartAutoHeader = document.getElementById('btnStartAutoHeader');
        if (!btnStartAutoHeader) {
          btnStartAutoHeader = document.createElement('button');
          btnStartAutoHeader.id = 'btnStartAutoHeader';
        }
        btnStartAutoHeader.textContent = '自動程序啟動';
        btnStartAutoHeader.addEventListener('click', async () => {
          try {
            const r = await guardedPost('btnStartAutoHeader', '/start_auto');
            if (r.ok) {
              // 啟動成功後跳轉到自動視窗頁面
              window.location.href = 'auto.html';
            } else {
              updateLocalStatus('自動程序啟動失敗 - ' + r.text);
            }
          } catch (e) { console.error('自動程序啟動失敗:', e); }
        });
        btnStartAutoHeader.disabled = !window._loggedIn;
        if (connControls) {
          if (btnStartAutoHeader.parentElement !== connControls) connControls.appendChild(btnStartAutoHeader);
        } else if (authButtons && btnStartAutoHeader.parentElement !== authButtons) {
          authButtons.appendChild(btnStartAutoHeader);
        }

        let btnStopAutoHeader = document.getElementById('btnStopAutoHeader');
        if (!btnStopAutoHeader) {
          btnStopAutoHeader = document.createElement('button');
          btnStopAutoHeader.id = 'btnStopAutoHeader';
        }
        btnStopAutoHeader.textContent = '自動程序停止';
        btnStopAutoHeader.addEventListener('click', async () => {
          try {
            const r = await guardedPost('btnStopAutoHeader', '/stop_auto');
            if (!r.ok) updateLocalStatus('自動程序停止失敗 - ' + r.text);
          } catch (e) { console.error('自動程序停止失敗:', e); }
        });
        btnStopAutoHeader.disabled = !window._loggedIn;
        if (connControls) {
          if (btnStopAutoHeader.parentElement !== connControls) connControls.appendChild(btnStopAutoHeader);
        } else if (authButtons && btnStopAutoHeader.parentElement !== authButtons) {
          authButtons.appendChild(btnStopAutoHeader);
        }

        // create login/logout button depending on state
        if (window._loggedIn) {
          const btnLogout = document.createElement('button');
          btnLogout.id = 'btnLogout';
          btnLogout.textContent = '登出';
          btnLogout.addEventListener('click', logout);
          authButtons.appendChild(btnLogout);
          authStatus.textContent = '';
          authStatus.className = 'auth-status';
        } else {
          const btnLogin = document.createElement('button');
          btnLogin.id = 'btnLogin';
          btnLogin.textContent = '登入';
          btnLogin.addEventListener('click', showPinModal);
          authButtons.appendChild(btnLogin);
          authStatus.textContent = '';
          authStatus.className = 'auth-status';
        }

      // Disable/enable interactive controls depending on login state
      try {
        const ids = ['btnOscilloscope','btnAttitude','btnMechanism','btnAutoTest','btnConnectHeader', 'btnDisconnectHeader', 'btnStartAutoHeader', 'btnStopAutoHeader', 'btnToggleStatusHeader', 'btnBrowseEsi', 'btnReadSDO', 'btnWriteSDO', 'btnReadAllSDO', 'btnWriteAllSDO', 'slaveSelect', 'adapterSelect'];
        
        if (window._loggedIn) {
          // If logged in, keep buttons disabled initially and wait for server UI state
          ids.forEach(id => {
            try {
              const el = document.getElementById(id);
              if (el) el.disabled = true; // Keep disabled until pollUiState completes
            } catch (_) { }
          });
          // Fetch UI state from server first, then enable buttons based on server response
          (async () => {
            try {
              await pollUiState();
              // Enable buttons that are not explicitly disabled by server
              ids.forEach(id => {
                try {
                  const el = document.getElementById(id);
                  // Only enable if not already disabled by pollUiState
                  if (el && el.disabled) {
                    // Check if this button has a server-side disable flag, otherwise enable
                    const serverDisableMap = {
                      'btnConnectHeader': window._lastUiState?.connect,
                      'btnDisconnectHeader': window._lastUiState?.disconnect,
                      'btnStartAutoHeader': window._lastUiState?.start_auto,
                      'btnStopAutoHeader': window._lastUiState?.stop_auto,
                      'btnToggleStatusHeader': window._lastUiState?.toggle_status,
                      'btnBrowseEsi': window._lastUiState?.browse_esi
                    }; 
                    // Only apply server-provided UI state. Do NOT let the client
                    // enable buttons when the server did not explicitly send a
                    // value for this control — that would allow the page to
                    // 'self-enable' buttons. If server sends a boolean, honor it.
                    const srvVal = serverDisableMap[id];
                    if (typeof srvVal !== 'undefined') {
                      el.disabled = !!srvVal;
                    }
                  }
                } catch (_) { }
              });
            } catch (_) {
              // If pollUiState fails, do NOT enable buttons locally — the
              // authoritative state comes from the server via SSE or ui_state.
              // Keep buttons disabled until the server explicitly provides
              // their states.
            }
          })();
        } else {
          // Not logged in, disable all buttons
          ids.forEach(id => {
            try {
              const el = document.getElementById(id);
              if (el) el.disabled = true;
            } catch (_) { }
          });
        }

        // After login: ensure a default adapter is selected in the UI and inform server.
        // Run asynchronously so updateAuthUI stays synchronous.
        if (window._loggedIn) (async function applyDefaultAdapterAfterLogin() {
          try {
            const sel = document.getElementById('adapterSelect');
            const st = document.getElementById('adapterStatus');
            if (!sel) return;
            let appliedServerSelection = false;
            if (lastServerSelectedAdapterValue) {
              appliedServerSelection = applyAdapterSelection(lastServerSelectedAdapterValue);
            }
            if (!appliedServerSelection) {
              let firstIndex = -1;
              for (let i = 0; i < sel.options.length; ++i) {
                if (!sel.options[i].disabled) { firstIndex = i; break; }
              }
              if (firstIndex === -1 && sel.options.length > 0) firstIndex = 0;
              if (firstIndex === -1) return;
              if (sel.selectedIndex !== firstIndex) {
                sel.selectedIndex = firstIndex;
              }
            }
            // Do NOT automatically notify server of the selection on page reload.
            // Previously we posted '/set_adapter' here which caused duplicate
            // "Selected adapter (web)" logs on refresh; instead, only notify
            // the server when the user explicitly changes the adapter via UI.
            try {
              if (st) {
                if (appliedServerSelection) st.textContent = '已還原伺服器選取的網卡項目';
                else st.textContent = '登入後預設已選擇網卡（不自動同步至伺服器）';
              }
            } catch (_) { }
          } catch (_) { }
        })();
        // Adapter sync removed: frontend will no longer accept server-provided adapter lists
      } catch (_) { }
    }

    async function post(path, options = {}) {
      try {
        const headers = options.headers || {};
        // Use credentials to include HttpOnly session cookie when present
        const r = await fetch(path, Object.assign({ method: 'POST', headers, credentials: 'same-origin' }, options));
        const t = await r.text();
        return { ok: r.ok, text: t };
      } catch (e) {
        return { ok: false, text: e.toString() };
      }
    }

    // ESI upload handling (guarded to prevent repeated/overlapping Win32 file dialogs)
    const btnBrowseEsi = document.getElementById('btnBrowseEsi');
    if (btnBrowseEsi) {
      // global lock: true when an ESI browse is in progress
      window._esiBrowseLock = window._esiBrowseLock || false;
      btnBrowseEsi.addEventListener('click', async (ev) => {
        if (window._esiBrowseLock) {
          updateLocalStatus('ESI 瀏覽已在進行中，請勿重複按下。');
          return;
        }
        window._esiBrowseLock = true;
        // disable UI affordance immediately to give user feedback
        try { btnBrowseEsi.disabled = true; } catch (_) { }

        // safety timeout: if something hangs, auto-unlock after 30s
        let safetyTimer = setTimeout(() => {
          window._esiBrowseLock = false;
          try { btnBrowseEsi.disabled = false; } catch (_) { }
          updateLocalStatus('ESI 鎖定已超時並已解除，請重試。');
        }, 30000);

        try {
          // Notify server to open local file browser and import ESI
          const r = await fetch('/browse_esi', { method: 'POST', credentials: 'same-origin' });
          if (!r.ok) { updateLocalStatus('無法通知後端瀏覽 ESI (HTTP ' + r.status + ')'); return; }
          updateLocalStatus('已通知後端開啟 ESI 瀏覽，請在主機視窗完成選擇');

          // Refresh slave list (ESI may add slaves) and request a full SDO read to populate cache
          try { await fetchAndRender(); } catch (_) { }
          try { await fetch('/read_all_sdo', { method: 'POST', credentials: 'same-origin' }); } catch (_) { }

          // Poll for parsed SDOs for selected or first slave
          let sel = (document.getElementById('slaveSelect') && document.getElementById('slaveSelect').value) || '';
          if (!sel) {
            try { const rr = await fetch('/slaves', { cache: 'no-store' }); if (rr.ok) { const arr = await rr.json(); if (Array.isArray(arr) && arr.length > 0) sel = arr[0].position !== undefined ? String(arr[0].position) : (arr[0].index !== undefined ? String(arr[0].index) : ''); } } catch (_) { }
          }

          async function pollSdoOnce(slavePos) { if (!slavePos) return null; try { const r2 = await fetch('/sdo?slave=' + encodeURIComponent(slavePos), { cache: 'no-store' }); if (!r2.ok) return null; try { return await r2.json(); } catch (_) { return null; } } catch (_) { return null; } }

          const timeoutMs = 10000; const start = Date.now(); let found = null;
          while (Date.now() - start < timeoutMs) { found = await pollSdoOnce(sel); if (found && Array.isArray(found) && found.length > 0) break; await new Promise(r => setTimeout(r, 500)); }
          if (found && Array.isArray(found) && found.length > 0) { renderSdoTable(found); updateLocalStatus('已載入並顯示解析後的 SDO'); }
          else updateLocalStatus('尚未收到解析後的 SDO，請確認 Win32 視窗是否完成匯入');
        } catch (e) { updateLocalStatus('通知後端瀏覽 ESI 失敗: ' + e); }
        finally {
          // clear safety timer and release lock
          try { clearTimeout(safetyTimer); } catch (_) { }
          window._esiBrowseLock = false;
          try { btnBrowseEsi.disabled = false; } catch (_) { }
        }
      });
    }

    // getStatus removed: logs are not displayed in the web UI

    // Login modal now provided by shared auth.js (simple modal). Old keyboard modal removed.

    // --- Numeric keypad for configured period (ms) ---
    (function () {
      // create keypad DOM once
      const kbHtml = `
